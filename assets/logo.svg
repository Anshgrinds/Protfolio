<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="60%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#8a2be2"/>
    </linearGradient>

    <!-- Neon Core Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#00f2fe"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Ambient Shadow & Glow -->
    <filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="outer-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00f2fe" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle Frame -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="7" filter="url(#outer-glow)"/>

  <!-- Subtle Inner Grid / Precision Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(0, 242, 254, 0.06)" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(79, 172, 254, 0.05)" stroke-width="2"/>

  <!-- The "A + J" Geometric Emblem -->
  <!-- Left Leg of 'A' -->
  <path d="M 148 376 L 256 128" 
        fill="none" 
        stroke="url(#neon-grad)" 
        stroke-width="38" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#core-glow)" />

  <!-- Right Leg of 'A' continuing into the 'J' Hook -->
  <path d="M 256 128 L 364 340 C 378 370 366 404 332 414 C 298 424 266 406 256 376" 
        fill="none" 
        stroke="url(#neon-grad)" 
        stroke-width="38" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#core-glow)" />

  <!-- Horizontal Tech Crossbar of 'A' -->
  <line x1="194" y1="288" x2="326" y2="288" 
        stroke="url(#accent-grad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        filter="url(#core-glow)" />

  <!-- Glowing Apex Focal Pulse Node -->
  <circle cx="256" cy="128" r="14" fill="#ffffff" filter="url(#core-glow)"/>
  <circle cx="256" cy="128" r="7" fill="#00f2fe"/>

  <!-- Corner Tech Accent Notch (Top Right) -->
  <path d="M 380 90 L 416 90 L 416 126" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  
  <!-- Corner Tech Accent Notch (Bottom Left) -->
  <path d="M 132 422 L 96 422 L 96 386" fill="none" stroke="#8a2be2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>
